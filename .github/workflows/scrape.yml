name: Scrape and publish

on:
  schedule:
    - cron: '23 * * * *'      # every hour
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/**', 'scraper/**', '.github/workflows/scrape.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Scrape portals
        run: node scraper/run.js
        env:
          PAGES: '3'
          ENRICH_PER_RUN: '30'
      - name: Commit data
        run: |
          git config user.name "scraper-bot"
          git config user.email "scraper-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "data: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash origin main || true
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
