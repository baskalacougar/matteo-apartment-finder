<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16203a"/>
      <stop offset="0.6" stop-color="#0d1326"/>
      <stop offset="1" stop-color="#080b16"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="house" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset="0.5" stop-color="#f1d98a"/>
      <stop offset="1" stop-color="#c9a24a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="0.7" stop-color="#34d399" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="round"><rect x="0" y="0" width="512" height="512" rx="112"/></clipPath>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <g clip-path="url(#round)">
    <circle cx="256" cy="268" r="230" fill="url(#glow)"/>

    <!-- radar rings -->
    <g fill="none" stroke="#34d399" stroke-width="3">
      <circle cx="256" cy="268" r="200" stroke-opacity="0.22"/>
      <circle cx="256" cy="268" r="150" stroke-opacity="0.32"/>
      <circle cx="256" cy="268" r="100" stroke-opacity="0.45"/>
    </g>
    <g stroke="#34d399" stroke-opacity="0.18" stroke-width="2">
      <line x1="56" y1="268" x2="456" y2="268"/>
      <line x1="256" y1="68" x2="256" y2="468"/>
    </g>

    <!-- sweep wedge: from the top, clockwise -->
    <path d="M256 268 L256 56 A212 212 0 0 1 464 306 Z" fill="url(#sweep)"/>
    <line x1="256" y1="268" x2="256" y2="56" stroke="#6ee7b7" stroke-width="4" stroke-linecap="round" stroke-opacity="0.95"/>

    <!-- blips -->
    <circle cx="356" cy="196" r="9" fill="#34d399"/>
    <circle cx="356" cy="196" r="18" fill="none" stroke="#34d399" stroke-opacity="0.35" stroke-width="3"/>
    <circle cx="176" cy="362" r="6" fill="#34d399" fill-opacity="0.7"/>
  </g>

  <!-- house -->
  <g filter="url(#soft)">
    <path d="M256 168 L152 258 H180 V352 A10 10 0 0 0 190 362 H236 V304 H276 V362 H322 A10 10 0 0 0 332 352 V258 H360 Z" fill="url(#house)"/>
    <rect x="292" y="188" width="24" height="46" rx="4" fill="url(#house)"/>
  </g>
</svg>
